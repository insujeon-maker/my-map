<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>전국 콜키지프리 맛집 지도</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { height: 100%; font-family: 'Malgun Gothic', sans-serif; overflow: hidden; }
        .container { display: flex; height: 100%; width: 100%; }
        
        .sidebar { width: 380px; height: 100%; background: #fff; box-shadow: 2px 0 5px rgba(0,0,0,0.1); z-index: 10; display: flex; flex-direction: column; }
        .sidebar-header { padding: 20px; background: #4285F4; color: white; }
        .sidebar-header h1 { font-size: 20px; margin-bottom: 5px; }
        
        /* 🛠️ 2단계 필터 컨테이너 */
        .filter-section {
            background: #f8f9fa;
            border-bottom: 1px solid #eee;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 15px 20px;
        }

        .filter-label {
            font-size: 11px;
            color: #868e96;
            font-weight: bold;
            text-transform: uppercase;
        }

        /* 버튼 컨테이너 (스크롤 제한) */
        .filter-container { 
            display: flex; 
            gap: 8px; 
            flex-wrap: wrap; 
            max-height: 85px;         /* 3줄 정도 높이로 제한 */
            overflow-y: auto;          /* 넘치면 스크롤 */
        }
        
        .filter-btn { padding: 6px 12px; font-size: 12px; border: 1px solid #ced4da; background: white; border-radius: 20px; cursor: pointer; font-weight: bold; color: #495057; transition: all 0.2s; }
        .filter-btn:hover { background: #e9ecef; }
        .filter-btn.active { background: #4285F4; color: white; border-color: #4285F4; }
        
        /* 하위 구 필터 영역 스타일 */
        #sub-filter-section {
            border-top: 1px dashed #dee2e6;
            padding-top: 10px;
        }

        .restaurant-list { overflow-y: auto; flex: 1; }
        .restaurant-item { padding: 20px; border-bottom: 1px solid #eee; cursor: pointer; transition: background 0.2s; }
        .restaurant-item:hover { background: #f1f3f4; }
        .restaurant-item h3 { font-size: 16px; margin-bottom: 5px; color: #333; }
        .restaurant-item p { font-size: 13px; color: #666; margin-bottom: 5px; }
        .badge { display: inline-block; padding: 3px 6px; font-size: 11px; background: #e8f0fe; color: #4285F4; border-radius: 4px; font-weight: bold; }
        
        .map-container { flex: 1; height: 100%; background: #e5e3df; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="sidebar-header">
                <h1>🍾 전국 콜키지프리 맛집 지도</h1>
                <p>광역시/도를 먼저 선택하고 구를 선택해 보세요.</p>
            </div>
            
            <!-- 🛠️ 2단계 지역 필터 영역 -->
            <div class="filter-section">
                <!-- 1단계: 광역시/도 선택 (우리나라 전국 지자체 반영) -->
                <div>
                    <div class="filter-label">지역 (시/도)</div>
                    <div class="filter-container" id="city-container">
                        <button class="filter-btn active" onclick="selectCity('all', this)">전체</button>
                        <button class="filter-btn" onclick="selectCity('서울특별시', this)">서울</button>
                        <button class="filter-btn" onclick="selectCity('부산광역시', this)">부산</button>
                        <button class="filter-btn" onclick="selectCity('대구광역시', this)">대구</button>
                        <button class="filter-btn" onclick="selectCity('인천광역시', this)">인천</button>
                        <button class="filter-btn" onclick="selectCity('광주광역시', this)">광주</button>
                        <button class="filter-btn" onclick="selectCity('대전광역시', this)">대전</button>
                        <button class="filter-btn" onclick="selectCity('울산광역시', this)">울산</button>
                        <button class="filter-btn" onclick="selectCity('세종특별자치시', this)">세종</button>
                        <button class="filter-btn" onclick="selectCity('경기도', this)">경기</button>
                        <button class="filter-btn" onclick="selectCity('강원특별자치도', this)">강원</button>
                        <button class="filter-btn" onclick="selectCity('충청북도', this)">충북</button>
                        <button class="filter-btn" onclick="selectCity('충청남도', this)">충남</button>
                        <button class="filter-btn" onclick="selectCity('전북특별자치도', this)">전북</button>
                        <button class="filter-btn" onclick="selectCity('전라남도', this)">전남</button>
                        <button class="filter-btn" onclick="selectCity('경상북도', this)">경북</button>
                        <button class="filter-btn" onclick="selectCity('경상남도', this)">경남</button>
                        <button class="filter-btn" onclick="selectCity('제주특별자치도', this)">제주</button>
                    </div>
                </div>

                <!-- 2단계: 세부 구/시 선택 (동적 생성됨) -->
                <div id="sub-filter-section" style="display: none;">
                    <div class="filter-label" id="sub-filter-label">세부 지역</div>
                    <div class="filter-container" id="region-container"></div>
                </div>
            </div>
            
            <div class="restaurant-list" id="list-container"></div>
        </div>
        
        <div class="map-container">
            <iframe id="google-map" src="https://maps.google.com/maps?q=강남역&t=&z=15&ie=UTF-8&iwloc=&output=embed"></iframe>
        </div>
    </div>

    <script>
        // 🛠️ 전국 맛집 데이터 목록 (city 값을 버튼 조건값과 정확히 일치시킵니다)
        const restaurantData = [
            { name: "트라가 역삼점", address: "서울 강남구 테헤란로25길 46", info: "네이버 예약 고객 콜키지 1병 프리", city: "서울특별시", region: "강남구" },
            { name: "고우가 여의도점", address: "서울 영등포구 여의대로 24", info: "콜키지 프리", city: "서울특별시", region: "영등포구" },
            { name: "우수", address: "서울특별시 마포구 백범로 199", info: "콜키지 프리 및 무제한 주차장 완비", city: "서울특별시", region: "마포구" },
            { name: "메르시", address: "서울특별시 서초구 논현로 나길 10", info: "와인, 위스키 콜키지 프리, 글라스 차지 1잔당 3,000원", city: "서울특별시", region: "서초구" },
            { name: "효 정자동본점", address: "경기도 성남시 분당구 성남대로 275", info: "-", city: "경기도", region: "분당구" },
            { name: "양마담 방촌양고기 분당직영점", address: "경기도 성남시 분당구 정자일로 162", city: "경기도", region: "분당구", info: "-" },
            { name: "제주클래식 분당점", address: "경기도 성남시 분당구 정자일로 240", city: "경기도", region: "분당구", info: "-" },
            { name: "인천 송도 갈비", address: "인천 연수구 인천타워대로 251", info: "와인 콜키지 프리", city: "인천광역시", region: "연수구" },
            { name: "부산 해운대 소문난암소갈비", address: "부산 해운대구 중동2로10번길 30-10", info: "콜키지 병당 프리 이벤트 중", city: "부산광역시", region: "해운대구" }
            // 추후 대구, 대전, 광주 등의 맛집을 추가할 때도 city를 각각 "대구광역시", "대전광역시", "광주광역시" 등으로 채워 넣으시면 됩니다.
        ];

        // 현재 선택된 필터 상태 관리
        let currentCity = 'all';
        let currentRegion = 'all';

        function changeMap(keyword) {
            const mapUrl = `https://maps.google.com/maps?q=${encodeURIComponent(keyword)}&t=&z=16&ie=UTF-8&iwloc=&output=embed`;
            document.getElementById('google-map').src = mapUrl;
        }

        // 광역시/도 선택 시 실행되는 함수
        function selectCity(city, buttonElement) {
            document.querySelectorAll('#city-container .filter-btn').forEach(btn => btn.classList.remove('active'));
            buttonElement.classList.add('active');

            currentCity = city;
            currentRegion = 'all';

            const subSection = document.getElementById('sub-filter-section');
            const regionContainer = document.getElementById('region-container');

            if (city === 'all') {
                subSection.style.display = 'none';
                displayList('all', 'all');
            } else {
                subSection.style.display = 'block';
                document.getElementById('sub-filter-label').innerText = `${city} 세부 지역`;
                
                // 해당 도시에 실제로 존재하는 구(region) 목록만 추출하여 중복 제거
                const regions = [...new Set(
                    restaurantData
                        .filter(store => store.city === city)
                        .map(store => store.region)
                )].sort();

                // 2단계 구 버튼 생성 (해당 지역에 등록된 데이터가 없을 경우 '등록된 지역 없음'을 보여줌)
                regionContainer.innerHTML = `<button class="filter-btn active" onclick="selectRegion('all', this)">전체</button>`;
                
                if (regions.length === 0) {
                    regionContainer.innerHTML = `<span style="font-size: 12px; color: #999; padding-left: 5px;">등록된 맛집 정보가 아직 없습니다.</span>`;
                } else {
                    regions.forEach(reg => {
                        if(reg && reg !== "-") {
                            regionContainer.innerHTML += `<button class="filter-btn" onclick="selectRegion('${reg}', this)">${reg}</button>`;
                        }
                    });
                }

                displayList(city, 'all');
            }
        }

        // 하위 구/군/시 선택 시 실행되는 함수
        function selectRegion(region, buttonElement) {
            document.querySelectorAll('#region-container .filter-btn').forEach(btn => btn.classList.remove('active'));
            buttonElement.classList.add('active');

            currentRegion = region;
            displayList(currentCity, currentRegion);
        }

        // 리스트 필터링 출력
        function displayList(cityFilter, regionFilter) {
            const listContainer = document.getElementById('list-container');
            listContainer.innerHTML = ""; 

            restaurantData.forEach((store) => {
                const matchCity = (cityFilter === 'all' || store.city === cityFilter);
                const matchRegion = (regionFilter === 'all' || store.region === regionFilter);

                if (matchCity && matchRegion) {
                    const listItem = document.createElement('div');
                    listItem.className = 'restaurant-item';
                    listItem.onclick = () => changeMap(store.address + " " + store.name);
                    listItem.innerHTML = `
                        <h3>${store.name}</h3>
                        <p>${store.address}</p>
                        <span class="badge">${store.info}</span>
                    `;
                    listContainer.appendChild(listItem);
                }
            });
        }

        displayList('all', 'all');
    </script>
</body>
</html>
