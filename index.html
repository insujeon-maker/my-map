        .sidebar { width: 380px; height: 100%; background: #fff; box-shadow: 2px 0 5px rgba(0,0,0,0.1); z-index: 10; display: flex; flex-direction: column; }
        .sidebar-header { padding: 20px; background: #4285F4; color: white; }

        /* 🛠️ 버튼 영역의 최대 높이를 제한하고 스크롤바 추가 */
        .filter-container { 
            padding: 15px 20px; 
            background: #f8f9fa; 
            border-bottom: 1px solid #eee; 
            display: flex; 
            gap: 8px; 
            flex-wrap: wrap; 
            max-height: 120px;         /* 3줄 정도 높이로 제한 */
            overflow-y: auto;          /* 높이를 넘어가면 세로 스크롤 생김 */

        .filter-btn { padding: 6px 12px; font-size: 12px; border: 1px solid #ced4da; background: white; border-radius: 20px; cursor: pointer; font-weight: bold; color: #495057; transition: all 0.2s; }
        .filter-btn:hover { background: #e9ecef; }
        .filter-btn.active { background: #4285F4; color: white; border-color: #4285F4; }
        
        .restaurant-list { overflow-y: auto; flex: 1; }
        .restaurant-item { padding: 20px; border-bottom: 1px solid #eee; cursor: pointer; transition: background 0.2s; }
        .restaurant-item:hover { background: #f1f3f4; }
        .restaurant-item h3 { font-size: 16px; margin-bottom: 5px; color: #333; }
        .restaurant-item p { font-size: 13px; color: #666; margin-bottom: 5px; }
        .badge { display: inline-block; padding: 3px 6px; font-size: 11px; background: #e8f0fe; color: #4285F4; border-radius: 4px; font-weight: bold; }
        
        .map-container { flex: 1; height: 100%; background: #e5e3df; }
        iframe { width: 100%; height: 100%; border: none; }

        function changeMap(keyword) {
            const mapUrl = `https://maps.google.com/maps?q=${encodeURIComponent(keyword)}&t=&z=16&ie=UTF-8&iwloc=&output=embed`;
            document.getElementById('google-map').src = mapUrl;
        }

        function displayList(regionFilter) {
            const listContainer = document.getElementById('list-container');
            listContainer.innerHTML = ""; 

            restaurantData.forEach((store) => {
                if (regionFilter === 'all' || store.region === regionFilter) {
                    const listItem = document.createElement('div');
                    listItem.className = 'restaurant-item';
                    listItem.onclick = () => changeMap(store.address + " " + store.name);
                    listItem.innerHTML = `
                        <h3>${store.name}</h3>
                        <p>${store.address}</p>
                        <span class="badge">${store.info}</span>
                    `;
                    listContainer.appendChild(listItem);
                }
            });
        }

        function filterRegion(region, buttonElement) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            buttonElement.classList.add('active');
            displayList(region);
        }

        displayList('all');
