<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>전국 콜키지프리 맛집 지도</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Helvetica Neue', 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif; }
    body, html { width: 100%; height: 100%; overflow: hidden; }
    .container { display: flex; width: 100vw; height: 100vh; }
    
    /* 사이드바 스타일 */
    .sidebar { width: 380px; height: 100%; background: #ffffff; border-right: 1px solid #e0e0e0; display: flex; flex-direction: column; z-index: 10; box-shadow: 2px 0 10px rgba(0,0,0,0.05); }
    .sidebar-header { padding: 24px 20px 16px; background: #681DD6; color: white; display: flex; justify-content: space-between; align-items: flex-start; }
    .sidebar-header h1 { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
    .sidebar-header p { font-size: 13px; opacity: 0.9; line-height: 1.4; }
    .header-logo { width: 65px; height: auto; border-radius: 8px; }

    /* 필터 영역 */
    .filter-section { padding: 16px 20px; border-bottom: 1px solid #eee; background: #fafafa; }
    .filter-label { font-size: 12px; font-weight: 700; color: #666; margin-bottom: 8px; display: block; }
    .filter-container { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .filter-btn { border: 1px solid #ddd; background: #fff; color: #444; padding: 5px 10px; border-radius: 16px; font-size: 12px; cursor: pointer; transition: all 0.2s; }
    .filter-btn:hover { background: #f0f0f0; }
    .filter-btn.active { background: #681DD6; color: #fff; border-color: #681DD6; font-weight: 600; }

    /* 리스트 영역 */
    .restaurant-list { overflow-y: auto; flex: 1; }
    .restaurant-item { padding: 20px; border-bottom: 1px solid #eee; cursor: pointer; transition: background 0.2s; }
    .restaurant-item:hover { background: #f1f3f4; }
    .restaurant-title-area { display: flex; align-items: baseline; gap: 6px; margin-bottom: 5px; }
    .restaurant-item h3 { font-size: 16px; color: #333; }
    .restaurant-category { font-size: 12px; color: #D28E00; font-weight: bold; background: #FFF4CC; padding: 2px 6px; border-radius: 3px; }
    .restaurant-item p { font-size: 13px; color: #666; margin-bottom: 3px; }
    .restaurant-item .menu-info { font-size: 12px; color: #888; margin-bottom: 8px; display: flex; align-items: center; gap: 4px; }
    .restaurant-item .menu-info::before { content: "🍴"; font-size: 11px; }
    .badge { display: inline-block; padding: 3px 6px; font-size: 11px; background: #f3ebff; color: #681DD6; border-radius: 4px; font-weight: bold; }

    /* 지도 영역 */
    .map-container { flex: 1; height: 100%; background: #e5e3df; }
    iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="sidebar">
      <div class="sidebar-header">
        <div class="header-text">
          <h1>전국 콜키지프리 맛집 지도</h1>
          <p>술을 사랑하는 여러분을 위해<br>요즘이술이 준비했습니다 💜</p>
          <p style="font-size: 11px; margin-top: 8px; opacity: 0.85;">문의사항은 yosool@chosunbiz.com</p>
        </div>
        <img class="header-logo" src="yosool_logo_65.png" alt="요즘이술 로고">
      </div>

      <!-- 2단계 지역 필터 영역 -->
      <div class="filter-section">
        <!-- 1단계: 광역시/도 선택 (요청하신 순서로 변경) -->
        <div>
          <div class="filter-label">지역 (시/도)</div>
          <div class="filter-container" id="city-container">
            <button class="filter-btn active" data-city="all" onclick="selectCity('all', this)">전체</button>
            <button class="filter-btn" data-city="서울" onclick="selectCity('서울', this)">서울</button>
            <button class="filter-btn" data-city="경기" onclick="selectCity('경기', this)">경기</button>
            <button class="filter-btn" data-city="부산" onclick="selectCity('부산', this)">부산</button>
            <button class="filter-btn" data-city="제주" onclick="selectCity('제주', this)">제주</button>
            <button class="filter-btn" data-city="인천" onclick="selectCity('인천', this)">인천</button>
            <button class="filter-btn" data-city="대구" onclick="selectCity('대구', this)">대구</button>
            <button class="filter-btn" data-city="광주" onclick="selectCity('광주', this)">광주</button>
            <button class="filter-btn" data-city="대전" onclick="selectCity('대전', this)">대전</button>
            <button class="filter-btn" data-city="울산" onclick="selectCity('울산', this)">울산</button>
            <button class="filter-btn" data-city="세종" onclick="selectCity('세종', this)">세종</button>
            <button class="filter-btn" data-city="강원" onclick="selectCity('강원', this)">강원</button>
            <button class="filter-btn" data-city="충북" onclick="selectCity('충북', this)">충북</button>
            <button class="filter-btn" data-city="충남" onclick="selectCity('충남', this)">충남</button>
            <button class="filter-btn" data-city="전북" onclick="selectCity('전북', this)">전북</button>
            <button class="filter-btn" data-city="전남" onclick="selectCity('전남', this)">전남</button>
            <button class="filter-btn" data-city="경북" onclick="selectCity('경북', this)">경북</button>
            <button class="filter-btn" data-city="경남" onclick="selectCity('경남', this)">경남</button>
          </div>
        </div>

        <!-- 2단계: 세부 구/시 선택 -->
        <div id="sub-filter-section" style="display: none;">
          <div class="filter-label" id="sub-filter-label">세부 지역</div>
          <div class="filter-container" id="region-container"></div>
        </div>
      </div>

      <div class="restaurant-list" id="list-container"></div>
    </div>

    <div class="map-container">
      <iframe id="google-map" src="https://maps.google.com/maps?q=대한민국&t=&z=7&ie=UTF-8&iwloc=&output=embed"></iframe>
    </div>
  </div>

  <script>
    const sheetUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRQJNWvQO4xEdc6oYle5wIXjLXIUYeqmXDzB-k9qNDgPtNTSTEPTjMvkUg5HQxttVViWfyH4UryVtxJ/pub?gid=0&single=true&output=csv";
    let restaurantData = [];
    let currentCity = 'all';
    let currentRegion = 'all';

    // 시/도 정식 명칭 매핑
    const cityFullNameMap = {
      '서울': '서울특별시', '부산': '부산광역시', '대구': '대구광역시',
      '인천': '인천광역시', '광주': '광주광역시', '대전': '대전광역시',
      '울산': '울산광역시', '세종': '세종특별자치시', '경기': '경기도',
      '강원': '강원특별자치도', '충북': '충청북도', '충남': '충청남도',
      '전북': '전북특별자치도', '전남': '전라남도', '경북': '경상북도',
      '경남': '경상남도', '제주': '제주특별자치도'
    };

    // CSV 파싱 함수
    function parseCSV(text) {
      const lines = text.split('\n');
      const result = [];
      for (let i = 1; i < lines.length; i++) {
        if (!lines[i].trim()) continue;
        const row = [];
        let insideQuote = false;
        let entry = '';
        for (let char of lines[i]) {
          if (char === '"') insideQuote = !insideQuote;
          else if (char === ',' && !insideQuote) {
            row.push(entry.trim());
            entry = '';
          } else entry += char;
        }
        row.push(entry.trim());

        if (row.length >= 9) {
          result.push({
            id: Number(row[0]) || 0,
            name: row[1],
            category: row[2],
            location: row[3],
            rating: row[4],
            reviews: row[5],
            price_range: row[6],
            corkage_info: row[7],
            description: row[8]
          });
        }
      }
      return result;
    }

    // 시 데이터 불러오기 및 정렬
    async function loadData() {
      try {
        const response = await fetch(sheetUrl);
        const csvText = await response.text();
        
        // 데이터 파싱
        restaurantData = parseCSV(csvText);

        // 🔥 ID 기준 내림차순 정렬 (높은 숫자가 맨 위로)
        restaurantData.sort((a, b) => b.id - a.id);

        renderList(restaurantData);
      } catch (error) {
        console.error('데이터를 불러오는데 실패했습니다:', error);
      }
    }

    // 시/도 선택 처리
    function selectCity(city, btnElement) {
      currentCity = city;
      currentRegion = 'all';

      // 시/도 버튼 활성화 처리
      document.querySelectorAll('#city-container .filter-btn').forEach(btn => btn.classList.remove('active'));
      btnElement.classList.add('active');

      const subSection = document.getElementById('sub-filter-section');
      const regionContainer = document.getElementById('region-container');

      if (city === 'all') {
        subSection.style.display = 'none';
        filterData();
        return;
      }

      // 선택된 시/도에 속한 세부 지역(location) 구하기
      const fullCityName = cityFullNameMap[city] || city;
      const filtered = restaurantData.filter(item => item.location.includes(city) || item.location.includes(fullCityName));
      
      const regions = [...new Set(filtered.map(item => {
        const parts = item.location.split(' ');
        return parts.length > 1 ? parts[1] : parts[0];
      }))].filter(Boolean);

      if (regions.length > 0) {
        subSection.style.display = 'block';
        regionContainer.innerHTML = `<button class="filter-btn active" onclick="selectRegion('all', this)">전체</button>` +
          regions.map(r => `<button class="filter-btn" onclick="selectRegion('${r}', this)">${r}</button>`).join('');
      } else {
        subSection.style.display = 'none';
      }

      filterData();
    }

    // 세부 구/시 선택 처리
    function selectRegion(region, btnElement) {
      currentRegion = region;
      document.querySelectorAll('#region-container .filter-btn').forEach(btn => btn.classList.remove('active'));
      btnElement.classList.add('active');
      filterData();
    }

    // 데이터 필터링 후 출력
    function filterData() {
      let filtered = restaurantData;

      if (currentCity !== 'all') {
        const fullCityName = cityFullNameMap[currentCity] || currentCity;
        filtered = filtered.filter(item => item.location.includes(currentCity) || item.location.includes(fullCityName));
      }

      if (currentRegion !== 'all') {
        filtered = filtered.filter(item => item.location.includes(currentRegion));
      }

      renderList(filtered);
    }

    // 리스트 화면 렌더링
    function renderList(data) {
      const container = document.getElementById('list-container');
      if (data.length === 0) {
        container.innerHTML = '<div style="padding:20px; text-align:center; color:#888;">해당하는 매장이 없습니다.</div>';
        return;
      }

      container.innerHTML = data.map(item => `
        <div class="restaurant-item" onclick="updateMap('${item.name}', '${item.location}')">
          <div class="restaurant-title-area">
            <h3>${item.name}</h3>
            ${item.category ? `<span class="restaurant-category">${item.category}</span>` : ''}
          </div>
          <p>${item.location} ${item.rating ? `· ⭐ ${item.rating}` : ''}</p>
          ${item.price_range ? `<div class="menu-info">${item.price_range}</div>` : ''}
          ${item.corkage_info ? `<span class="badge">🍷 ${item.corkage_info}</span>` : ''}
        </div>
      `).join('');
    }

    // 지도 미리보기 업데이트
    function updateMap(name, location) {
      const mapFrame = document.getElementById('google-map');
      const query = encodeURIComponent(`${location} ${name}`);
      mapFrame.src = `https://maps.google.com/maps?q=${query}&t=&z=15&ie=UTF-8&iwloc=&output=embed`;
    }

    // 페이지 로드 시 시작
    loadData();
  </script>
</body>
</html>
